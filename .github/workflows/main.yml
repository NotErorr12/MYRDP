name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $password = "core_2_quad"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($existingUser) {
              Set-LocalUser -Name "RDP" -Password $securePass
          }
          else {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }

          $groups = @("Administrators", "Remote Desktop Users")

          foreach ($group in $groups) {
              $members = Get-LocalGroupMember -Group $group -ErrorAction SilentlyContinue

              if (-not ($members | Where-Object { $_.Name -match '\\RDP$' })) {
                  Add-LocalGroupMember -Group $group -Member "RDP"
              }
          }

          Write-Host "RDP user configured successfully."

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait

          Remove-Item $installer -Force

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Start-Service -Name Tailscale

          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="gh-runner-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 10

          $ip = & $ts ip -4

          if (-not $ip) {
              throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389

          if (-not $result.TcpTestSucceeded) {
              Write-Host "RDP port is not reachable yet."
          }
          else {
              Write-Host "RDP port is reachable."
          }

      - name: Display RDP Information
        shell: powershell
        run: |
          Write-Host "=============================="
          Write-Host "RDP ADDRESS: $env:TAILSCALE_IP"
          Write-Host "USERNAME: RDP"
          Write-Host "PASSWORD: core_2_quad"
          Write-Host "=============================="

      - name: Keep Runner Active
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Runner Active"
              Start-Sleep -Seconds 300
          }
